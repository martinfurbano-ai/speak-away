name: iPhone

# Builds the iPhone app and keyboard for the simulator, takes every screenshot (light and dark, Spanish and
# English) with the app's fictional preview data, and runs the launch-argument self test. Nothing is signed and
# no secret is used. The screenshots come back as the "screens" artifact.

on:
  push:
    branches: [iphone]
    paths:
      - "ios/**"
      - "app/Sources/SpeakAwayCore/**"
      - "app/Sources/SpeakAwayBrain/**"
      - ".github/workflows/iphone.yml"
  workflow_dispatch:
    inputs:
      screens:
        description: "Screens to capture (blank for all)"
        required: false
        default: ""

concurrency:
  group: iphone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project SpeakAway.xcodeproj -scheme SpeakAway \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/dd \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build | tail -25

      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in data if "iOS-26" in k), reverse=True)
          for runtime in runtimes:
              phones = [d for d in data[runtime] if d["name"].startswith("iPhone") and "Pro" in d["name"]]
              phones = phones or [d for d in data[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(sorted(phones, key=lambda d: d["name"])[-1]["udid"])
                  break
          ')
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Screenshots
        run: |
          mkdir -p screens
          SPEAKAWAY_SETTLE=4 ios/scripts/screens.sh "$UDID" "$PWD/screens" ${{ github.event.inputs.screens }}
          ls screens | wc -l

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: screens/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Self test
        run: SPEAKAWAY_SIM_DEVICE="$UDID" ios/scripts/self-test.sh
